<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Center Fuselage Body -->
  <rect x="9.5" y="8" width="5" height="8" rx="2" fill="currentColor" fill-opacity="0.25"/>
  <!-- Front Heading Indicator -->
  <polygon points="12,5.5 10.2,7.5 13.8,7.5" fill="currentColor"/>
  <!-- Motor Arms -->
  <line x1="10" y1="9.5" x2="4.5" y2="4.5"/>
  <line x1="14" y1="9.5" x2="19.5" y2="4.5"/>
  <line x1="10" y1="14.5" x2="4.5" y2="19.5"/>
  <line x1="14" y1="14.5" x2="19.5" y2="19.5"/>
  <!-- Top Left Rotor Disc & Motor Hub -->
  <circle cx="4.5" cy="4.5" r="3.2" stroke-dasharray="1.5 1.5"/>
  <circle cx="4.5" cy="4.5" r="1.2" fill="currentColor"/>
  <!-- Top Right Rotor Disc & Motor Hub -->
  <circle cx="19.5" cy="4.5" r="3.2" stroke-dasharray="1.5 1.5"/>
  <circle cx="19.5" cy="4.5" r="1.2" fill="currentColor"/>
  <!-- Bottom Left Rotor Disc & Motor Hub -->
  <circle cx="4.5" cy="19.5" r="3.2" stroke-dasharray="1.5 1.5"/>
  <circle cx="4.5" cy="19.5" r="1.2" fill="currentColor"/>
  <!-- Bottom Right Rotor Disc & Motor Hub -->
  <circle cx="19.5" cy="19.5" r="3.2" stroke-dasharray="1.5 1.5"/>
  <circle cx="19.5" cy="19.5" r="1.2" fill="currentColor"/>
</svg>
